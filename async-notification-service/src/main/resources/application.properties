# =========================================================
# APPLICATION
# =========================================================
spring.application.name=async-notification-service
server.port=8080

# =========================================================
# CORS
# =========================================================
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# =========================================================
# MONGODB
# =========================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/notification_system_db}
spring.mongodb.database=${MONGODB_DATABASE:notification_system_db}

#spring.data.mongodb.uri=mongodb://localhost:27017/notification_system_db
#spring.mongodb.database=notification_system_db

# =========================================================
# RABBITMQ
# =========================================================
spring.rabbitmq.addresses=${RABBITMQ_URL}

# Retry configuration
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =========================================================
# EMAIL / SMTP
# =========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Avoid SMTP connection hanging indefinitely
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# BULK FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never